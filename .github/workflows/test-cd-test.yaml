          echo "              DEPLOYMENT DEBUG"
          echo "=================================================="


          echo ""
          echo "APPLICATION PODS"
          kubectl get pods \
            -n "$NAMESPACE" \
            -o wide \
            || true


          echo ""
          echo "PVC"
          kubectl get pvc \
            -n "$NAMESPACE" \
            || true


          echo ""
          echo "PV"
          kubectl get pv \
            || true


          echo ""
          echo "STORAGE CLASS"
          kubectl get storageclass \
            || true


          echo ""
          echo "KUBERNETES EVENTS"

          kubectl get events \
            -n "$NAMESPACE" \
            --sort-by='.lastTimestamp' \
            || true


          echo ""
          echo "EBS CSI PODS"

          kubectl get pods \
            -n kube-system \
            -l app.kubernetes.io/name=aws-ebs-csi-driver \
            -o wide \
            || true


          echo ""
