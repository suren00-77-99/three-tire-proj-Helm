name: CD - Deploy Application

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git commit SHA tag produced by CI"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

  AWS_GITHUB_ROLE_ARN: ${{ vars.AWS_GITHUB_ROLE_ARN }}

  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

  FRONTEND_IMAGE: ${{ vars.ECR_REGISTRY }}/three-tier-frontend
  BACKEND_IMAGE: ${{ vars.ECR_REGISTRY }}/three-tier-backend

  NAMESPACE: three-tier
  RELEASE_NAME: three-tier-app

  # EBS CSI IAM role
  AWS_EBS_CSI_ROLE_NAME: AmazonEKS_EBS_CSI_DriverRole
  AWS_EBS_CSI_POLICY_ARN: arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy


jobs:

  # ============================================================
  # 1. CHECK EKS
  # ============================================================
  check-eks:

    name: Check EKS
    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check EKS cluster
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "CHECK EKS"
          echo "=========================================="

          if ! aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo "ERROR: EKS cluster does not exist."
            exit 1
          fi

          STATUS=$(aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text)

          echo "Cluster : $EKS_CLUSTER_NAME"
          echo "Status  : $STATUS"

          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ERROR: EKS cluster is not ACTIVE."
            exit 1
          fi

          echo "EKS cluster is ACTIVE."

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Check nodes
        run: |

          set -euo pipefail

          kubectl get nodes

          NOT_READY=$(kubectl get nodes --no-headers | \
            awk '$2 != "Ready" {print}')

          if [ -n "$NOT_READY" ]; then
            echo "ERROR: Nodes are not Ready."
            echo "$NOT_READY"
            exit 1
          fi

          echo "All nodes are Ready."


  # ============================================================
  # 2. HELM VALIDATION + REQUIREMENT DETECTION
  # ============================================================
  prepare:

    name: Validate Helm
    runs-on: ubuntu-latest

    needs:
      - check-eks

    outputs:
      ebs_required: ${{ steps.detect.outputs.ebs_required }}
      efs_required: ${{ steps.detect.outputs.efs_required }}
      alb_required: ${{ steps.detect.outputs.alb_required }}

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v4

      # --------------------------------------------------------
      # HELM LINT
      # --------------------------------------------------------
      - name: Helm lint
        run: |

          set -euo pipefail

          helm lint helm/three-tier-app

      # --------------------------------------------------------
      # HELM TEMPLATE
      # --------------------------------------------------------
      - name: Render Helm chart
        run: |

          set -euo pipefail

          helm template "$RELEASE_NAME" \
            helm/three-tier-app \
            --namespace "$NAMESPACE" \
            --set frontend.image.repository="$FRONTEND_IMAGE" \
            --set frontend.image.tag="${{ inputs.image_tag }}" \
            --set frontend.image.pullPolicy=Always \
            --set backend.image.repository="$BACKEND_IMAGE" \
            --set backend.image.tag="${{ inputs.image_tag }}" \
            --set backend.image.pullPolicy=Always \
            --set database.password="${{ secrets.DB_PASSWORD }}" \
            > /tmp/rendered.yaml

          echo "Helm template successful."

      # --------------------------------------------------------
      # DETECT REQUIRED INFRASTRUCTURE
      # --------------------------------------------------------
      - name: Detect infrastructure
        id: detect
        run: |

          set -euo pipefail

          EBS_REQUIRED=false
          EFS_REQUIRED=false
          ALB_REQUIRED=false

          echo "=========================================="
          echo "INFRASTRUCTURE DETECTION"
          echo "=========================================="

          # ====================================================
          # EBS
          # ====================================================

          if grep -q "ebs.csi.aws.com" /tmp/rendered.yaml || \
             grep -q "storageClassName: ebs-gp3" /tmp/rendered.yaml || \
             grep -qE "storageClassName:.*ebs" /tmp/rendered.yaml; then

            EBS_REQUIRED=true

            echo "EBS required: YES"

          else

            echo "EBS required: NO"

          fi


          # ====================================================
          # EFS
          # ====================================================

          if grep -q "efs.csi.aws.com" /tmp/rendered.yaml || \
             grep -q "ReadWriteMany" /tmp/rendered.yaml || \
             grep -qE "storageClassName:.*efs" /tmp/rendered.yaml; then

            EFS_REQUIRED=true

            echo "EFS required: YES"

          else

            echo "EFS required: NO"

          fi


          # ====================================================
          # ALB
          # ====================================================

          if grep -qE "^kind:[[:space:]]*Ingress" /tmp/rendered.yaml || \
             grep -q "ingressClassName: alb" /tmp/rendered.yaml || \
             grep -q "kubernetes.io/ingress.class: alb" /tmp/rendered.yaml; then

            ALB_REQUIRED=true

            echo "ALB required: YES"

          else

            echo "ALB required: NO"

          fi


          echo "ebs_required=$EBS_REQUIRED" >> "$GITHUB_OUTPUT"
          echo "efs_required=$EFS_REQUIRED" >> "$GITHUB_OUTPUT"
          echo "alb_required=$ALB_REQUIRED" >> "$GITHUB_OUTPUT"

      - name: Requirement summary
        run: |

          echo ""
          echo "=========================================="
          echo "REQUIREMENTS"
          echo "=========================================="

          echo "EBS : ${{ steps.detect.outputs.ebs_required }}"
          echo "EFS : ${{ steps.detect.outputs.efs_required }}"
          echo "ALB : ${{ steps.detect.outputs.alb_required }}"


  # ============================================================
  # 3. CONFIGURE REQUIRED INFRASTRUCTURE
  # ============================================================
  configure-infrastructure:

    name: Configure Infrastructure
    runs-on: ubuntu-latest

    needs:
      - prepare

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |

          set -euo pipefail

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"


      # ========================================================
      # EBS OIDC + IAM ROLE
      # ========================================================
      - name: Configure EBS CSI IAM
        if: needs.prepare.outputs.ebs_required == 'true'
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "EBS CSI IAM"
          echo "=========================================="

          # ----------------------------------------------------
          # Get OIDC issuer
          # ----------------------------------------------------

          OIDC_ISSUER=$(aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.identity.oidc.issuer' \
            --output text)

          if [ -z "$OIDC_ISSUER" ] || [ "$OIDC_ISSUER" = "None" ]; then

            echo "ERROR: EKS OIDC issuer not found."
            exit 1

          fi

          echo "OIDC issuer detected."

          OIDC_PROVIDER="${OIDC_ISSUER#https://}"

          echo "OIDC provider:"
          echo "$OIDC_PROVIDER"


          # ----------------------------------------------------
          # Check OIDC provider
          # ----------------------------------------------------

          OIDC_PROVIDER_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:oidc-provider/${OIDC_PROVIDER}"

          if aws iam get-open-id-connect-provider \
            --open-id-connect-provider-arn "$OIDC_PROVIDER_ARN" \
            >/dev/null 2>&1; then

            echo "OIDC provider already exists."

          else

            echo "OIDC provider does not exist."

            echo "Installing eksctl..."

            curl --silent --location \
              "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" \
              | tar xz -C /tmp

            sudo mv /tmp/eksctl /usr/local/bin/eksctl

            echo "Associating OIDC provider..."

            eksctl utils associate-iam-oidc-provider \
              --cluster "$EKS_CLUSTER_NAME" \
              --region "$AWS_REGION" \
              --approve

          fi


          # ----------------------------------------------------
          # Check IAM role
          # ----------------------------------------------------

          if aws iam get-role \
            --role-name "$AWS_EBS_CSI_ROLE_NAME" \
            >/dev/null 2>&1; then

            echo ""
            echo "EBS CSI IAM role already exists."
            echo "Role: $AWS_EBS_CSI_ROLE_NAME"

          else

            echo ""
            echo "EBS CSI IAM role does not exist."
            echo "Creating role..."

            cat > /tmp/ebs-trust-policy.json <<EOF
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Federated": "$OIDC_PROVIDER_ARN"
                },
                "Action": "sts:AssumeRoleWithWebIdentity",
                "Condition": {
                  "StringEquals": {
                    "${OIDC_PROVIDER}:aud": "sts.amazonaws.com",
                    "${OIDC_PROVIDER}:sub": "system:serviceaccount:kube-system:ebs-csi-controller-sa"
                  }
                }
              }
            ]
          }
          EOF

            aws iam create-role \
              --role-name "$AWS_EBS_CSI_ROLE_NAME" \
              --assume-role-policy-document file:///tmp/ebs-trust-policy.json

            echo "IAM role created."

          fi


          # ----------------------------------------------------
          # Attach EBS CSI policy
          # ----------------------------------------------------

          echo ""
          echo "Checking EBS CSI policy..."

          if aws iam list-attached-role-policies \
            --role-name "$AWS_EBS_CSI_ROLE_NAME" \
            --query "AttachedPolicies[?PolicyArn=='$AWS_EBS_CSI_POLICY_ARN'].PolicyArn" \
            --output text | grep -q "$AWS_EBS_CSI_POLICY_ARN"; then

            echo "EBS CSI policy already attached."

          else

            echo "Attaching EBS CSI policy..."

            aws iam attach-role-policy \
              --role-name "$AWS_EBS_CSI_ROLE_NAME" \
              --policy-arn "$AWS_EBS_CSI_POLICY_ARN"

            echo "EBS CSI policy attached."

          fi


          # ----------------------------------------------------
          # Get final role ARN
          # ----------------------------------------------------

          EBS_ROLE_ARN=$(aws iam get-role \
            --role-name "$AWS_EBS_CSI_ROLE_NAME" \
            --query 'Role.Arn' \
            --output text)

          echo ""
          echo "EBS CSI IAM role ready."
          echo "Role name: $AWS_EBS_CSI_ROLE_NAME"
          echo "Role ARN : $EBS_ROLE_ARN"


      # ========================================================
      # INSTALL / UPDATE EBS CSI ADDON
      # ========================================================
      - name: Install EBS CSI addon
        if: needs.prepare.outputs.ebs_required == 'true'
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "EBS CSI ADDON"
          echo "=========================================="

          EBS_ROLE_ARN=$(aws iam get-role \
            --role-name "$AWS_EBS_CSI_ROLE_NAME" \
            --query 'Role.Arn' \
            --output text)


          # ----------------------------------------------------
          # Check addon
          # ----------------------------------------------------

          if aws eks describe-addon \
            --cluster-name "$EKS_CLUSTER_NAME" \
            --addon-name aws-ebs-csi-driver \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo "EBS CSI addon already exists."

            aws eks update-addon \
              --cluster-name "$EKS_CLUSTER_NAME" \
              --addon-name aws-ebs-csi-driver \
              --service-account-role-arn "$EBS_ROLE_ARN" \
              --resolve-conflicts OVERWRITE \
              --region "$AWS_REGION"

          else

            echo "EBS CSI addon does not exist."
            echo "Installing..."

            aws eks create-addon \
              --cluster-name "$EKS_CLUSTER_NAME" \
              --addon-name aws-ebs-csi-driver \
              --service-account-role-arn "$EBS_ROLE_ARN" \
              --resolve-conflicts OVERWRITE \
              --region "$AWS_REGION"

          fi


          # ----------------------------------------------------
          # Wait for addon
          # ----------------------------------------------------

          echo ""
          echo "Waiting for EBS CSI addon..."

          aws eks wait addon-active \
            --cluster-name "$EKS_CLUSTER_NAME" \
            --addon-name aws-ebs-csi-driver \
            --region "$AWS_REGION"

          echo ""
          echo "EBS CSI addon is ACTIVE."


      # ========================================================
      # EFS CSI
      # ========================================================
      - name: Install EFS CSI addon
        if: needs.prepare.outputs.efs_required == 'true'
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "EFS CSI ADDON"
          echo "=========================================="

          if [ -z "${AWS_EFS_CSI_ROLE_ARN:-}" ]; then

            echo "ERROR: AWS_EFS_CSI_ROLE_ARN is not configured."

            exit 1

          fi

          if aws eks describe-addon \
            --cluster-name "$EKS_CLUSTER_NAME" \
            --addon-name aws-efs-csi-driver \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo "EFS CSI addon already exists."

            aws eks update-addon \
              --cluster-name "$EKS_CLUSTER_NAME" \
              --addon-name aws-efs-csi-driver \
              --service-account-role-arn "$AWS_EFS_CSI_ROLE_ARN" \
              --resolve-conflicts OVERWRITE \
              --region "$AWS_REGION"

          else

            echo "Installing EFS CSI addon..."

            aws eks create-addon \
              --cluster-name "$EKS_CLUSTER_NAME" \
              --addon-name aws-efs-csi-driver \
              --service-account-role-arn "$AWS_EFS_CSI_ROLE_ARN" \
              --resolve-conflicts OVERWRITE \
              --region "$AWS_REGION"

          fi

          aws eks wait addon-active \
            --cluster-name "$EKS_CLUSTER_NAME" \
            --addon-name aws-efs-csi-driver \
            --region "$AWS_REGION"

          echo "EFS CSI addon is ACTIVE."


      # ========================================================
      # ALB CONTROLLER
      # ========================================================
      - name: Install AWS Load Balancer Controller
        if: needs.prepare.outputs.alb_required == 'true'
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "AWS LOAD BALANCER CONTROLLER"
          echo "=========================================="

          if [ -z "${AWS_LB_CONTROLLER_ROLE_ARN:-}" ]; then

            echo "ERROR: AWS_LB_CONTROLLER_ROLE_ARN is not configured."

            exit 1

          fi

          helm repo add eks \
            https://aws.github.io/eks-charts

          helm repo update

          VPC_ID=$(aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.resourcesVpcConfig.vpcId' \
            --output text)

          helm upgrade --install \
            aws-load-balancer-controller \
            eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName="$EKS_CLUSTER_NAME" \
            --set region="$AWS_REGION" \
            --set vpcId="$VPC_ID" \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="$AWS_LB_CONTROLLER_ROLE_ARN" \
            --wait \
            --timeout 10m

          echo "AWS Load Balancer Controller ready."


  # ============================================================
  # 4. DEPLOY APPLICATION
  # ============================================================
  deploy:

    name: Deploy Application
    runs-on: ubuntu-latest

    needs:
      - configure-infrastructure

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      # --------------------------------------------------------
      # Namespace
      # --------------------------------------------------------
      - name: Create namespace
        run: |

          kubectl get namespace "$NAMESPACE" \
            >/dev/null 2>&1 \
            || kubectl create namespace "$NAMESPACE"

      # --------------------------------------------------------
      # Check ECR images
      # --------------------------------------------------------
      - name: Check ECR images
        run: |

          set -euo pipefail

          aws ecr describe-images \
            --repository-name three-tier-frontend \
            --image-ids imageTag="${{ inputs.image_tag }}" \
            --region "$AWS_REGION" \
            >/dev/null

          aws ecr describe-images \
            --repository-name three-tier-backend \
            --image-ids imageTag="${{ inputs.image_tag }}" \
            --region "$AWS_REGION" \
            >/dev/null

          echo "ECR images found."


      # ========================================================
      # HELM DEPLOY
      # ========================================================
      - name: Deploy with Helm
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "HELM DEPLOYMENT"
          echo "=========================================="

          helm upgrade --install "$RELEASE_NAME" \
            helm/three-tier-app \
            --namespace "$NAMESPACE" \
            --set frontend.image.repository="$FRONTEND_IMAGE" \
            --set frontend.image.tag="${{ inputs.image_tag }}" \
            --set frontend.image.pullPolicy=Always \
            --set backend.image.repository="$BACKEND_IMAGE" \
            --set backend.image.tag="${{ inputs.image_tag }}" \
            --set backend.image.pullPolicy=Always \
            --set database.password="${{ secrets.DB_PASSWORD }}" \
            --wait \
            --timeout 15m

          echo "Helm deployment successful."


      # ========================================================
      # FRONTEND
      # ========================================================
      - name: Wait for frontend
        run: |

          kubectl rollout status \
            deployment/"$RELEASE_NAME-frontend" \
            -n "$NAMESPACE" \
            --timeout=5m

          echo "Frontend is Ready."


      # ========================================================
      # BACKEND
      # ========================================================
      - name: Wait for backend
        run: |

          kubectl rollout status \
            deployment/"$RELEASE_NAME-backend" \
            -n "$NAMESPACE" \
            --timeout=5m

          echo "Backend is Ready."


      # ========================================================
      # POSTGRESQL
      # ========================================================
      - name: Wait for PostgreSQL
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "POSTGRESQL"
          echo "=========================================="

          kubectl rollout status \
            statefulset/"$RELEASE_NAME-postgres" \
            -n "$NAMESPACE" \
            --timeout=10m

          echo "PostgreSQL is Ready."


      # ========================================================
      # FINAL STATUS
      # ========================================================
      - name: Deployment summary
        run: |

          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "              DEPLOYMENT SUMMARY"
          echo "=================================================="

          echo ""
          echo "EKS:"
          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.{Name:name,Status:status,Version:version}' \
            --output table

          echo ""
          echo "Deployments:"
          kubectl get deployments \
            -n "$NAMESPACE"

          echo ""
          echo "StatefulSets:"
          kubectl get statefulsets \
            -n "$NAMESPACE"

          echo ""
          echo "Pods:"
          kubectl get pods \
            -n "$NAMESPACE" \
            -o wide

          echo ""
          echo "Services:"
          kubectl get services \
            -n "$NAMESPACE"

          echo ""
          echo "PVC:"
          kubectl get pvc \
            -n "$NAMESPACE"

          echo ""
          echo "PV:"
          kubectl get pv

          echo ""
          echo "StorageClass:"
          kubectl get storageclass

          echo ""
          echo "EBS CSI:"
          kubectl get pods \
            -n kube-system \
            -l app.kubernetes.io/name=aws-ebs-csi-driver \
            -o wide || true

          echo ""
          echo "=================================================="
          echo "       APPLICATION DEPLOYMENT SUCCESSFUL"
          echo "=================================================="


      # ========================================================
      # DEBUG ON FAILURE
      # ========================================================
      - name: Debug on failure
        if: failure()
        run: |

          echo "=========================================="
          echo "DEPLOYMENT DEBUG"
          echo "=========================================="

          echo ""
          echo "Application pods:"
          kubectl get pods \
            -n "$NAMESPACE" \
            -o wide || true

          echo ""
          echo "PVC:"
          kubectl get pvc \
            -n "$NAMESPACE" || true

          echo ""
          echo "PV:"
          kubectl get pv || true

          echo ""
          echo "StorageClass:"
          kubectl get storageclass || true

          echo ""
          echo "Events:"
          kubectl get events \
            -n "$NAMESPACE" \
            --sort-by='.lastTimestamp' || true

          echo ""
          echo "EBS CSI:"
          kubectl get pods \
            -n kube-system \
            -l app.kubernetes.io/name=aws-ebs-csi-driver \
            -o wide || true

          echo ""
          echo "PostgreSQL:"
          kubectl describe pod \
            "$RELEASE_NAME-postgres-0" \
            -n "$NAMESPACE" || true