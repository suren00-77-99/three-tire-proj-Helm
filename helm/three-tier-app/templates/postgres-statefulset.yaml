apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: {{ include "three-tier-app.fullname" . }}-postgres
  namespace: three-tier

  labels:
    {{- include "three-tier-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: database

spec:
  serviceName: {{ include "three-tier-app.fullname" . }}-postgres

  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "three-tier-app.name" . }}
      app.kubernetes.io/component: database

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "three-tier-app.name" . }}
        app.kubernetes.io/component: database

    spec:

      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 30

      containers:

        - name: postgres

          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"

          imagePullPolicy: {{ .Values.database.image.pullPolicy }}

          env:

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "three-tier-app.fullname" . }}-db
                  key: database

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "three-tier-app.fullname" . }}-db
                  key: username

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "three-tier-app.fullname" . }}-db
                  key: password

            # IMPORTANT:
            # PostgreSQL must use a subdirectory inside the EBS mount.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"

            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: 50m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:

            # MUST match volumeClaimTemplates.metadata.name
            - name: data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:

    - metadata:
        name: data

      spec:
        accessModes:
          - {{ .Values.database.storage.accessMode }}

        storageClassName: {{ .Values.database.storageClass.name }}

        resources:
          requests:
            storage: {{ .Values.database.storage.size }}