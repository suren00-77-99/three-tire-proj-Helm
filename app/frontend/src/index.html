<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Three Tier DevOps Lab</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px}
    .card{border:1px solid #ddd;border-radius:12px;padding:24px;margin-top:20px}
    button{padding:10px 16px;border-radius:8px;border:1px solid #888;cursor:pointer}
    pre{background:#f5f5f5;padding:16px;border-radius:8px;overflow:auto}
  </style>
</head>
<body>
  <h1>Three-Tier Kubernetes Application</h1>
  <p>Frontend → Backend → PostgreSQL</p>
  <div class="card">
    <button onclick="checkBackend()">Check backend</button>
    <pre id="result">Click the button.</pre>
  </div>
<script>
async function checkBackend(){
  const result=document.getElementById('result');
  try {
    const response=await fetch('/api/health');
    result.textContent=await response.text();
  } catch(e) {
    result.textContent='Backend request failed: '+e.message;
  }
}
</script>
</body>
</html>
