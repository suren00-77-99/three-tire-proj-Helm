name: CD - Deploy Three Tier Application

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git commit SHA tag produced by CI"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  # ============================================================
  # AWS
  # ============================================================
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

  AWS_GITHUB_ROLE_ARN: ${{ vars.AWS_GITHUB_ROLE_ARN }}

  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

  # ============================================================
  # ECR
  # ============================================================
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

  FRONTEND_IMAGE: ${{ vars.ECR_REGISTRY }}/three-tier-frontend
  BACKEND_IMAGE: ${{ vars.ECR_REGISTRY }}/three-tier-backend

  # ============================================================
  # KUBERNETES
  # ============================================================
  NAMESPACE: three-tier
  RELEASE_NAME: three-tier-app

  # ============================================================
  # EBS CSI
  # ============================================================
  AWS_EBS_CSI_ROLE_NAME: AmazonEKS_EBS_CSI_DriverRole

  AWS_EBS_CSI_POLICY_ARN: arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy

  # ============================================================
  # EFS / ALB
  # ============================================================
  AWS_EFS_CSI_ROLE_ARN: ${{ vars.AWS_EFS_CSI_ROLE_ARN }}

  AWS_LB_CONTROLLER_ROLE_ARN: ${{ vars.AWS_LB_CONTROLLER_ROLE_ARN }}


jobs:

  # ============================================================
  # JOB 1
  # CHECK EKS
  # ============================================================
  check-eks:

    name: Check EKS
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # AWS LOGIN
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # CHECK EKS
      # --------------------------------------------------------
      - name: Check EKS cluster
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "CHECK EKS CLUSTER"
          echo "=========================================="

          if ! aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo "ERROR: EKS cluster does not exist."
            echo "Cluster: $EKS_CLUSTER_NAME"

            exit 1
          fi

          STATUS=$(aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text)

          echo "Cluster : $EKS_CLUSTER_NAME"
          echo "Status  : $STATUS"

          if [ "$STATUS" != "ACTIVE" ]; then

            echo "ERROR: EKS cluster is not ACTIVE."

            exit 1
          fi

          echo ""
          echo "EKS cluster is ACTIVE."

      # --------------------------------------------------------
      # KUBECTL
      # --------------------------------------------------------
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |

          set -euo pipefail

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      # --------------------------------------------------------
      # NODE CHECK
      # --------------------------------------------------------
      - name: Check worker nodes
        run: |

          set -euo pipefail

          kubectl get nodes

          NOT_READY=$(kubectl get nodes --no-headers | \
            awk '$2 != "Ready" {print}')

          if [ -n "$NOT_READY" ]; then

            echo ""
            echo "ERROR: Worker nodes are not Ready."
            echo "$NOT_READY"

            exit 1
          fi

          echo ""
          echo "All worker nodes are Ready."


  # ============================================================
  # JOB 2
  # HELM VALIDATION + INFRASTRUCTURE DETECTION
  # ============================================================
  prepare:

    name: Validate Helm and Detect Infrastructure
    runs-on: ubuntu-latest

    needs:
      - check-eks

    outputs:
      ebs_required: ${{ steps.detect.outputs.ebs_required }}
      efs_required: ${{ steps.detect.outputs.efs_required }}
      alb_required: ${{ steps.detect.outputs.alb_required }}

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------------
      # HELM
      # --------------------------------------------------------
      - name: Install Helm
        uses: azure/setup-helm@v4

      # --------------------------------------------------------
      # HELM LINT
      # --------------------------------------------------------
      - name: Helm lint
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "HELM LINT"
          echo "=========================================="

          helm lint helm/three-tier-app

      # --------------------------------------------------------
      # HELM TEMPLATE
      # --------------------------------------------------------
      - name: Render Helm chart
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "HELM TEMPLATE"
          echo "=========================================="

          helm template "$RELEASE_NAME" \
            helm/three-tier-app \
            --namespace "$NAMESPACE" \
            --set frontend.image.repository="$FRONTEND_IMAGE" \
            --set frontend.image.tag="${{ inputs.image_tag }}" \
            --set frontend.image.pullPolicy=Always \
            --set backend.image.repository="$BACKEND_IMAGE" \
            --set backend.image.tag="${{ inputs.image_tag }}" \
            --set backend.image.pullPolicy=Always \
            --set database.password="${{ secrets.DB_PASSWORD }}" \
            > /tmp/rendered.yaml

          echo "Helm template successful."

      # --------------------------------------------------------
      # DETECT INFRASTRUCTURE
      # --------------------------------------------------------
      - name: Detect infrastructure
        id: detect
        run: |

          set -euo pipefail

          EBS_REQUIRED=false
          EFS_REQUIRED=false
          ALB_REQUIRED=false

          echo "=========================================="
          echo "INFRASTRUCTURE DETECTION"
          echo "=========================================="

          # ====================================================
          # EBS
          # ====================================================

          if grep -q "ebs.csi.aws.com" /tmp/rendered.yaml || \
             grep -qE "storageClassName:.*ebs" /tmp/rendered.yaml; then

            EBS_REQUIRED=true

            echo "EBS: REQUIRED"

          else

            echo "EBS: NOT REQUIRED"

          fi


          # ====================================================
          # EFS
          # ====================================================

          if grep -q "efs.csi.aws.com" /tmp/rendered.yaml || \
             grep -q "ReadWriteMany" /tmp/rendered.yaml || \
             grep -qE "storageClassName:.*efs" /tmp/rendered.yaml; then

            EFS_REQUIRED=true

            echo "EFS: REQUIRED"

          else

            echo "EFS: NOT REQUIRED"

          fi


          # ====================================================
          # AWS LOAD BALANCER CONTROLLER
          # ====================================================

          if grep -qE "^kind:[[:space:]]*Ingress" /tmp/rendered.yaml || \
             grep -q "ingressClassName: alb" /tmp/rendered.yaml || \
             grep -q "kubernetes.io/ingress.class: alb" /tmp/rendered.yaml; then

            ALB_REQUIRED=true

            echo "ALB: REQUIRED"

          else

            echo "ALB: NOT REQUIRED"

          fi


          # ====================================================
          # OUTPUTS
          # ====================================================

          echo "ebs_required=$EBS_REQUIRED" >> "$GITHUB_OUTPUT"
          echo "efs_required=$EFS_REQUIRED" >> "$GITHUB_OUTPUT"
          echo "alb_required=$ALB_REQUIRED" >> "$GITHUB_OUTPUT"


          echo ""
          echo "=========================================="
          echo "INFRASTRUCTURE DECISION"
          echo "=========================================="

          echo "EBS : $EBS_REQUIRED"
          echo "EFS : $EFS_REQUIRED"
          echo "ALB : $ALB_REQUIRED"


  # ============================================================
  # JOB 3
  # CREATE IAM + INSTALL REQUIRED ADDONS
  # ============================================================
  infrastructure:

    name: Configure Required Infrastructure
    runs-on: ubuntu-latest

    needs:
      - prepare

    steps:

      # --------------------------------------------------------
      # AWS LOGIN
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # TOOLS
      # --------------------------------------------------------
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      # --------------------------------------------------------
      # KUBECONFIG
      # --------------------------------------------------------
      - name: Configure kubeconfig
        run: |

          set -euo pipefail

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"


      # ========================================================
      # EBS IAM ROLE
      # ========================================================
      - name: Create or verify EBS CSI IAM role
        if: needs.prepare.outputs.ebs_required == 'true'
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "EBS CSI IAM ROLE"
          echo "=========================================="

          # ----------------------------------------------------
          # Get OIDC issuer
          # ----------------------------------------------------

          OIDC_ISSUER=$(aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.identity.oidc.issuer' \
            --output text)

          if [ -z "$OIDC_ISSUER" ] || [ "$OIDC_ISSUER" = "None" ]; then

            echo "ERROR: EKS OIDC issuer is not configured."

            exit 1

          fi

          echo "OIDC issuer found."

          OIDC_PROVIDER="${OIDC_ISSUER#https://}"

          OIDC_PROVIDER_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:oidc-provider/${OIDC_PROVIDER}"

          # ----------------------------------------------------
          # Check OIDC provider
          # ----------------------------------------------------

          if aws iam get-open-id-connect-provider \
            --open-id-connect-provider-arn "$OIDC_PROVIDER_ARN" \
            >/dev/null 2>&1; then

            echo "OIDC provider already exists."

          else

            echo "OIDC provider does not exist."

            echo ""
            echo "Creating OIDC provider..."

            curl -sSL \
              "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" \
              | tar -xz -C /tmp

            sudo mv /tmp/eksctl /usr/local/bin/eksctl

            eksctl utils associate-iam-oidc-provider \
              --cluster "$EKS_CLUSTER_NAME" \
              --region "$AWS_REGION" \
              --approve

            echo "OIDC provider created."

          fi


          # ----------------------------------------------------
          # Check IAM role
          # ----------------------------------------------------

          if aws iam get-role \
            --role-name "$AWS_EBS_CSI_ROLE_NAME" \
            >/dev/null 2>&1; then

            echo ""
            echo "EBS CSI IAM role already exists."

          else

            echo ""
            echo "EBS CSI IAM role does not exist."
            echo "Creating role..."

            cat > /tmp/ebs-trust-policy.json <<EOF
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Federated": "$OIDC_PROVIDER_ARN"
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "${OIDC_PROVIDER}:aud": "sts.amazonaws.com",
                      "${OIDC_PROVIDER}:sub": "system:serviceaccount:kube-system:ebs-csi-controller-sa"
                    }
                  }
                }
              ]
            }
            EOF

                        aws iam create-role \
                          --role-name "$AWS_EBS_CSI_ROLE_NAME" \
                          --assume-role-policy-document file:///tmp/ebs-trust-policy.json

                        echo "EBS CSI IAM role created."

                      fi


          # ----------------------------------------------------
          # Attach EBS policy
          # ----------------------------------------------------

          POLICY_ATTACHED=$(aws iam list-attached-role-policies \
            --role-name "$AWS_EBS_CSI_ROLE_NAME" \
            --query "AttachedPolicies[?PolicyArn=='$AWS_EBS_CSI_POLICY_ARN'].PolicyArn" \
            --output text)

          if [ -n "$POLICY_ATTACHED" ]; then

            echo "EBS CSI policy already attached."

          else

            echo "Attaching EBS CSI policy..."

            aws iam attach-role-policy \
              --role-name "$AWS_EBS_CSI_ROLE_NAME" \
              --policy-arn "$AWS_EBS_CSI_POLICY_ARN"

            echo "EBS CSI policy attached."

          fi


          # ----------------------------------------------------
          # Final role check
          # ----------------------------------------------------

          EBS_ROLE_ARN=$(aws iam get-role \
            --role-name "$AWS_EBS_CSI_ROLE_NAME" \
            --query 'Role.Arn' \
            --output text)

          echo ""
          echo "EBS CSI IAM role ready."
          echo "Role: $EBS_ROLE_ARN"


      # ========================================================
      # EBS CSI ADDON
      # ========================================================
      - name: Install or repair EBS CSI addon
        if: needs.prepare.outputs.ebs_required == 'true'
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "EBS CSI ADDON"
          echo "=========================================="

          EBS_ROLE_ARN=$(aws iam get-role \
            --role-name "$AWS_EBS_CSI_ROLE_NAME" \
            --query 'Role.Arn' \
            --output text)


          # ----------------------------------------------------
          # Check addon
          # ----------------------------------------------------

          if aws eks describe-addon \
            --cluster-name "$EKS_CLUSTER_NAME" \
            --addon-name aws-ebs-csi-driver \
            --region "$AWS_REGION" \
            >/tmp/ebs-addon.json 2>/dev/null; then

            ADDON_STATUS=$(aws eks describe-addon \
              --cluster-name "$EKS_CLUSTER_NAME" \
              --addon-name aws-ebs-csi-driver \
              --region "$AWS_REGION" \
              --query 'addon.status' \
              --output text)

          else

            ADDON_STATUS="NOT_FOUND"

          fi


          echo "Current addon status: $ADDON_STATUS"


          # ====================================================
          # NOT FOUND
          # ====================================================

          if [ "$ADDON_STATUS" = "NOT_FOUND" ]; then

            echo ""
            echo "Creating EBS CSI addon..."

            aws eks create-addon \
              --cluster-name "$EKS_CLUSTER_NAME" \
              --addon-name aws-ebs-csi-driver \
              --service-account-role-arn "$EBS_ROLE_ARN" \
              --resolve-conflicts OVERWRITE \
              --region "$AWS_REGION"

          fi


          # ====================================================
          # CREATE_FAILED
          # ====================================================

          if [ "$ADDON_STATUS" = "CREATE_FAILED" ]; then

            echo ""
            echo "EBS CSI addon is CREATE_FAILED."
            echo "Deleting failed addon..."

            aws eks delete-addon \
              --cluster-name "$EKS_CLUSTER_NAME" \
              --addon-name aws-ebs-csi-driver \
              --region "$AWS_REGION"

            echo "Waiting for addon deletion..."

            for i in {1..60}; do

              if aws eks describe-addon \
                --cluster-name "$EKS_CLUSTER_NAME" \
                --addon-name aws-ebs-csi-driver \
                --region "$AWS_REGION" \
                >/dev/null 2>&1; then

                echo "Waiting... $i/60"
                sleep 10

              else

                echo "Addon deleted."
                break

              fi

            done


            # --------------------------------------------------
            # Verify deletion
            # --------------------------------------------------

            if aws eks describe-addon \
              --cluster-name "$EKS_CLUSTER_NAME" \
              --addon-name aws-ebs-csi-driver \
              --region "$AWS_REGION" \
              >/dev/null 2>&1; then

              echo "ERROR: Failed to delete EBS CSI addon."

              exit 1

            fi


            # --------------------------------------------------
            # Recreate addon
            # --------------------------------------------------

            echo ""
            echo "Creating EBS CSI addon again..."

            aws eks create-addon \
              --cluster-name "$EKS_CLUSTER_NAME" \
              --addon-name aws-ebs-csi-driver \
              --service-account-role-arn "$EBS_ROLE_ARN" \
              --resolve-conflicts OVERWRITE \
              --region "$AWS_REGION"

          fi


          # ====================================================
          # ACTIVE
          # ====================================================

          if [ "$ADDON_STATUS" = "ACTIVE" ]; then

            echo ""
            echo "EBS CSI addon is already ACTIVE."

            aws eks update-addon \
              --cluster-name "$EKS_CLUSTER_NAME" \
              --addon-name aws-ebs-csi-driver \
              --service-account-role-arn "$EBS_ROLE_ARN" \
              --resolve-conflicts OVERWRITE \
              --region "$AWS_REGION"

          fi


          # ====================================================
          # WAIT ACTIVE
          # ====================================================

          echo ""
          echo "Waiting for EBS CSI addon..."

          aws eks wait addon-active \
            --cluster-name "$EKS_CLUSTER_NAME" \
            --addon-name aws-ebs-csi-driver \
            --region "$AWS_REGION"

          echo ""
          echo "EBS CSI addon is ACTIVE."


      # ========================================================
      # EFS CSI ADDON
      # ========================================================
      - name: Install EFS CSI addon
        if: needs.prepare.outputs.efs_required == 'true'
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "EFS CSI ADDON"
          echo "=========================================="

          if [ -z "${AWS_EFS_CSI_ROLE_ARN:-}" ]; then

            echo "ERROR: AWS_EFS_CSI_ROLE_ARN is not configured."

            exit 1

          fi


          if aws eks describe-addon \
            --cluster-name "$EKS_CLUSTER_NAME" \
            --addon-name aws-efs-csi-driver \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo "EFS CSI addon already exists."

            aws eks update-addon \
              --cluster-name "$EKS_CLUSTER_NAME" \
              --addon-name aws-efs-csi-driver \
              --service-account-role-arn "$AWS_EFS_CSI_ROLE_ARN" \
              --resolve-conflicts OVERWRITE \
              --region "$AWS_REGION"

          else

            echo "Installing EFS CSI addon..."

            aws eks create-addon \
              --cluster-name "$EKS_CLUSTER_NAME" \
              --addon-name aws-efs-csi-driver \
              --service-account-role-arn "$AWS_EFS_CSI_ROLE_ARN" \
              --resolve-conflicts OVERWRITE \
              --region "$AWS_REGION"

          fi


          aws eks wait addon-active \
            --cluster-name "$EKS_CLUSTER_NAME" \
            --addon-name aws-efs-csi-driver \
            --region "$AWS_REGION"

          echo "EFS CSI addon is ACTIVE."


      # ========================================================
      # AWS LOAD BALANCER CONTROLLER
      # ========================================================
      - name: Install AWS Load Balancer Controller
        if: needs.prepare.outputs.alb_required == 'true'
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "AWS LOAD BALANCER CONTROLLER"
          echo "=========================================="

          if [ -z "${AWS_LB_CONTROLLER_ROLE_ARN:-}" ]; then

            echo "ERROR: AWS_LB_CONTROLLER_ROLE_ARN is not configured."

            exit 1

          fi


          helm repo add eks \
            https://aws.github.io/eks-charts

          helm repo update


          VPC_ID=$(aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.resourcesVpcConfig.vpcId' \
            --output text)


          helm upgrade --install \
            aws-load-balancer-controller \
            eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName="$EKS_CLUSTER_NAME" \
            --set region="$AWS_REGION" \
            --set vpcId="$VPC_ID" \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="$AWS_LB_CONTROLLER_ROLE_ARN" \
            --wait \
            --timeout 10m


          echo "AWS Load Balancer Controller ready."


  # ============================================================
  # JOB 4
  # DEPLOY APPLICATION
  # ============================================================
  deploy:

    name: Deploy Application
    runs-on: ubuntu-latest

    needs:
      - infrastructure

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # --------------------------------------------------------
      # AWS
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # TOOLS
      # --------------------------------------------------------
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      # --------------------------------------------------------
      # KUBECONFIG
      # --------------------------------------------------------
      - name: Configure kubeconfig
        run: |

          set -euo pipefail

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"


      # --------------------------------------------------------
      # NAMESPACE
      # --------------------------------------------------------
      - name: Create namespace
        run: |

          kubectl get namespace "$NAMESPACE" \
            >/dev/null 2>&1 \
            || kubectl create namespace "$NAMESPACE"


      # --------------------------------------------------------
      # ECR IMAGE CHECK
      # --------------------------------------------------------
      - name: Verify ECR images
        run: |

          set -euo pipefail

          echo "Checking frontend image..."

          aws ecr describe-images \
            --repository-name three-tier-frontend \
            --image-ids imageTag="${{ inputs.image_tag }}" \
            --region "$AWS_REGION" \
            >/dev/null


          echo "Checking backend image..."

          aws ecr describe-images \
            --repository-name three-tier-backend \
            --image-ids imageTag="${{ inputs.image_tag }}" \
            --region "$AWS_REGION" \
            >/dev/null


          echo "ECR images exist."


      # ========================================================
      # HELM DEPLOY
      # ========================================================
      - name: Deploy with Helm
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "HELM DEPLOYMENT"
          echo "=========================================="

          helm upgrade --install "$RELEASE_NAME" \
            helm/three-tier-app \
            --namespace "$NAMESPACE" \
            --set frontend.image.repository="$FRONTEND_IMAGE" \
            --set frontend.image.tag="${{ inputs.image_tag }}" \
            --set frontend.image.pullPolicy=Always \
            --set backend.image.repository="$BACKEND_IMAGE" \
            --set backend.image.tag="${{ inputs.image_tag }}" \
            --set backend.image.pullPolicy=Always \
            --set database.password="${{ secrets.DB_PASSWORD }}" \
            --wait \
            --timeout 15m

          echo ""
          echo "Helm deployment successful."


      # ========================================================
      # FRONTEND
      # ========================================================
      - name: Wait for frontend
        run: |

          set -euo pipefail

          echo "Waiting for frontend..."

          kubectl rollout status \
            deployment/"$RELEASE_NAME-frontend" \
            -n "$NAMESPACE" \
            --timeout=5m

          echo "Frontend is Ready."


      # ========================================================
      # BACKEND
      # ========================================================
      - name: Wait for backend
        run: |

          set -euo pipefail

          echo "Waiting for backend..."

          kubectl rollout status \
            deployment/"$RELEASE_NAME-backend" \
            -n "$NAMESPACE" \
            --timeout=5m

          echo "Backend is Ready."


      # ========================================================
      # POSTGRESQL
      # ========================================================
      - name: Wait for PostgreSQL
        run: |

          set -euo pipefail

          echo "Waiting for PostgreSQL..."

          kubectl rollout status \
            statefulset/"$RELEASE_NAME-postgres" \
            -n "$NAMESPACE" \
            --timeout=10m

          echo "PostgreSQL is Ready."


      # ========================================================
      # DATABASE PVC
      # ========================================================
      - name: Verify PostgreSQL PVC
        run: |

          set -euo pipefail

          PVC_NAME="data-${RELEASE_NAME}-postgres-0"

          echo "Checking PVC:"
          echo "$PVC_NAME"

          STATUS=$(kubectl get pvc "$PVC_NAME" \
            -n "$NAMESPACE" \
            -o jsonpath='{.status.phase}')

          echo "PVC status: $STATUS"

          if [ "$STATUS" != "Bound" ]; then

            echo "ERROR: PostgreSQL PVC is not Bound."

            kubectl describe pvc "$PVC_NAME" \
              -n "$NAMESPACE"

            exit 1

          fi

          echo "PostgreSQL PVC is Bound."


      # ========================================================
      # FINAL SUMMARY
      # ========================================================
      - name: Final deployment summary
        run: |

          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "              DEPLOYMENT SUMMARY"
          echo "=================================================="

          echo ""
          echo "EKS CLUSTER"
          echo "------------------------------------------"

          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.{Name:name,Status:status,Version:version}' \
            --output table


          echo ""
          echo "DEPLOYMENTS"
          echo "------------------------------------------"

          kubectl get deployments \
            -n "$NAMESPACE"


          echo ""
          echo "STATEFULSETS"
          echo "------------------------------------------"

          kubectl get statefulsets \
