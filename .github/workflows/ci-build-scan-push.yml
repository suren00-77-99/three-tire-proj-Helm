name: CI - Helm Build Scan Push

on:
  workflow_dispatch:    #  "Run workflow"   ✅ Enables button
  push:
    branches: ["master"]
    paths:
      - "app/**"
      - "helm/**"
      - ".github/workflows/ci-build-scan-push.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "app/**"
      - "helm/**"
      - ".github/workflows/ci-build-scan-push.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  AWS_GITHUB_ROLE_ARN: ${{ vars.AWS_GITHUB_ROLE_ARN }}

jobs:
  helm-lint-test:
    name: Helm lint and offline tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Helm lint
        run: helm lint helm/three-tier-app

      - name: Helm template
        run: |
          helm template three-tier-app helm/three-tier-app \
            --set frontend.image.repository=test/frontend \
            --set frontend.image.tag=test \
            --set backend.image.repository=test/backend \
            --set backend.image.tag=test \
            --set database.password=lab-password > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 1.0.3

      - name: Helm unit tests
        run: helm unittest helm/three-tier-app

  build-scan-push:
    name: Build, Trivy scan and push
    needs: helm-lint-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: frontend
            context: ./app/frontend
            repository: three-tier-frontend
          - name: backend
            context: ./app/backend
            repository: three-tier-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}
          
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ matrix.repository }}" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "${{ matrix.repository }}" \
            --image-scanning-configuration scanOnPush=true \
            --image-tag-mutability IMMUTABLE

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/${{ matrix.repository }}:${{ github.sha }}
        run: docker build --pull -t "$IMAGE_URI" "${{ matrix.context }}"

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.72.0
          cache: true

      - name: Trivy vulnerability scan
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/${{ matrix.repository }}:${{ github.sha }}
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            "$IMAGE_URI"

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ matrix.context }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Push approved image to ECR
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/${{ matrix.repository }}:${{ github.sha }}
        run: |
          docker push "$IMAGE_URI"
          docker image inspect "$IMAGE_URI" --format='digest={{index .RepoDigests 0}}' || true

      - name: Job summary
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/${{ matrix.repository }}:${{ github.sha }}
        run: |
          {
            echo "### ${{ matrix.name }} CI result"
            echo ""
            echo "- Helm lint: passed"
            echo "- Trivy: passed (HIGH/CRITICAL with fixes gate)"
            echo "- ECR image: \`$IMAGE_URI\`"
          } >> "$GITHUB_STEP_SUMMARY"
